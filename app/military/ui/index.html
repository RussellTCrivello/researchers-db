<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brigade Command — Military Organization</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        BRIGADE COMMAND
        <small>Military Organization · BIMS</small>
      </div>
      <nav id="nav"></nav>
    </aside>
    <div class="main">
      <header class="topbar">
        <h1 id="page-title">Workspace</h1>
        <span class="role-pill" id="role-pill">admin</span>
        <select id="role-select" title="Role">
          <option value="admin">admin</option>
          <option value="staff">staff</option>
          <option value="viewer">viewer</option>
        </select>
        <select id="lang-select" title="Language">
          <option value="en">EN</option>
          <option value="ar">AR</option>
        </select>
      </header>
      <div class="disclaimer" id="disclaimer"></div>
      <main class="content" id="view"></main>
    </div>
  </div>
  <div id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
