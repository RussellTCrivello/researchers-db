<text x="36" y="46" class="h">Where the calculated fields come from (ƒ)</text>
<text x="36" y="70" class="s">Every derived field is a SQL expression over the tables named on its right; nothing is stored, which is why all of them can be filtered, sorted, exported and charted.</text>
